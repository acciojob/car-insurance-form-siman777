<!DOCTYPE html>

<html>

<head>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <!-- the entire body must be written by student -->
  <h1>Car Insurance Registration Form</h1>
  <form action="#" method="post">
    <label for="name">Name:</label>
    <input type="text" id="name" required>
    <br>
    <label for="email">Email:</label>
    <input type="email" id="email" required>
    <br>
    <p><b>Gender:</b></p>
    <label for="Male">Male</label>
    <input type="radio" id="Male" name="gender" value="Male" required>
    <label for="female">Female</label>
    <input type="radio" id="female" name="gender" value="female" required>
    <br>
    <label for="cars">Car Brands:</label>
    <select id="cars">
      <option>BMW</option>
      <option>Audi</option>
      <option>Mercedez</option>
    </select>
    <br>
	<label for="carage">Car Age</label>  
	<input type="number" id="carage" required>  
    <label for="dop">Date of Purchase (dop):</label>
    <input type="date" id="dop" required>
    <br>
    <label for="password">Password</label>
    <input type="password" id="password" required>
    <br>
    <button type="submit" value="submit">Submit</button>

  </form>
  <script type="text/javascript" src="./script.js">
  </script>

</body>

</html>
